# Локальный подъём: docker compose up -d db (только база) или docker compose up -d --build (база + сервис).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 3s
      timeout: 1s
      retries: 10

  qr:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:-password}@db:5432/db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5213}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "127.0.0.1:5213:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
